<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e9" />
    <meta
      name="description"
      content="Conectando — la red social donde las personas se encuentran."
    />
    <!--
      El backend reemplaza este bloque por los metadatos de Open Graph
      reales (título, descripción e imagen) cuando alguien comparte un post
      o un perfil. Los lectores de links no ejecutan JavaScript, así que si
      los datos los pusiera el frontend no llegarían a verse nunca.
    -->
    <!--og-meta-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Conectando</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
